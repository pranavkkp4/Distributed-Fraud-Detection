apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.15
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=768M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda:9092
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: admin, containerPort: 9644}
          readinessProbe:
            httpGet: {path: /v1/status/ready, port: admin}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 1500Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
    - {name: admin, port: 9644, targetPort: admin}
