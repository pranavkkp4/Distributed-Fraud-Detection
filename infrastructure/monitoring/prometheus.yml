global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: fraud-worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: fraud-stream-processor
    static_configs:
      - targets: ["stream-processor:8082"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
