[package]
name = "fraud-shm-api-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
build = "build.rs"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.1", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.9.0"
flatbuffers = "25.12.19"
libc = "0.2.169"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
subtle = "2.6.1"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[build-dependencies]
which = "7.0.0"
